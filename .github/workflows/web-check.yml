# Builds the WEB version of the app on every branch push and pull request.
# It only checks that the web build compiles. It does NOT deploy anything.
name: Web build check

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable

      - run: flutter pub get

      - run: flutter build web --release
