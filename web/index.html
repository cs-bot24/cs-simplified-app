<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CS Simplified — AI-powered study platform for Computer Science students.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CS Simplified</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #1A1A2E;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Loading screen shown while Flutter initialises */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #1A1A2E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .logo-wrap {
      width: 72px;
      height: 72px;
      background: #6C63FF;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(108, 99, 255, 0.4);
    }

    .logo-text {
      color: white;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .app-name {
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .app-tagline {
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      margin-bottom: 40px;
    }

    /* Animated spinner */
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(108, 99, 255, 0.2);
      border-top-color: #6C63FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Branded loading screen — hidden once Flutter renders -->
  <div id="loading-screen">
    <div class="logo-wrap">
      <span class="logo-text">CS</span>
    </div>
    <div class="app-name">CS Simplified</div>
    <div class="app-tagline">AI-Powered Study Platform</div>
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('fade-out');
        setTimeout(function () {
          loadingScreen.style.display = 'none';
        }, 450);
      }
    });
  </script>

  <!-- pdf.js: draws the PDF pages inside the page (used by the web PDF viewer) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  </script>

  <script>
    // Draws the PDF at [url] inside [box] (used by lib/screens/pdf/pdf_web_panels.dart).
    // Full-width pages, drawn sharply, with pinch-to-zoom. Only pages near the
    // screen stay drawn so long PDFs do not run the phone out of memory.
    window.csRenderPdf = async function (box, url) {
      var say = function (t) { box.textContent = t; };
      try {
        say('Loading PDF\u2026');
        await new Promise(function (r) { setTimeout(r, 60); });
        if (typeof pdfjsLib === 'undefined') throw new Error('pdf.js did not load');
        var resp = await fetch(url);
        if (!resp.ok) throw new Error('download failed (HTTP ' + resp.status + ')');
        var data = await resp.arrayBuffer();
        var pdf = await pdfjsLib.getDocument({ data: data }).promise;
        box.textContent = '';

        var dpr = window.devicePixelRatio || 1;
        var density = Math.min(Math.max(dpr, 2) * 1.5, 4);
        var baseW = Math.max(box.clientWidth || window.innerWidth, 200);
        var zoom = 1;
        box.style.overflowX = 'auto';
        box.style.touchAction = 'pan-x pan-y';

        var inner = document.createElement('div');
        inner.style.width = baseW + 'px';
        box.appendChild(inner);

        var slots = [];
        for (var n = 1; n <= pdf.numPages; n++) {
          var page = await pdf.getPage(n);
          var vp1 = page.getViewport({ scale: 1 });
          var slot = document.createElement('div');
          slot.style.background = '#ffffff';
          slot.style.marginBottom = '14px';
          inner.appendChild(slot);
          slots.push({ el: slot, page: page, ratio: vp1.height / vp1.width, w1: vp1.width,
                       canvas: null, task: null });
        }

        var layout = function () {
          var w = Math.floor(baseW * zoom);
          inner.style.width = w + 'px';
          slots.forEach(function (s) {
            s.el.style.width = w + 'px';
            s.el.style.height = Math.floor(w * s.ratio) + 'px';
          });
        };
        layout();

        var draw = async function (s) {
          if (s.canvas || s.task) return;
          var cssW = Math.floor(baseW * zoom);
          var scale = (cssW / s.w1) * density;
          var vp = s.page.getViewport({ scale: scale });
          var k = 1;
          if (vp.width > 4096) k = Math.min(k, 4096 / vp.width);
          if (vp.width * vp.height * k * k > 16000000) k = Math.min(k, Math.sqrt(16000000 / (vp.width * vp.height)));
          if (k < 1) vp = s.page.getViewport({ scale: scale * k });
          var c = document.createElement('canvas');
          c.width = Math.floor(vp.width);
          c.height = Math.floor(vp.height);
          c.style.width = '100%';
          c.style.height = '100%';
          c.style.display = 'block';
          var task = s.page.render({ canvasContext: c.getContext('2d'), viewport: vp });
          s.task = task;
          try {
            await task.promise;
            if (s.task === task) { s.el.appendChild(c); s.canvas = c; }
          } catch (e) { /* cancelled while scrolling away */ }
          if (s.task === task) s.task = null;
        };
        var release = function (s) {
          if (s.task) { try { s.task.cancel(); } catch (e) {} s.task = null; }
          if (s.canvas) {
            s.el.removeChild(s.canvas);
            s.canvas.width = 0; s.canvas.height = 0;
            s.canvas = null;
          }
        };

        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            var s = slots[en.target.__i];
            if (en.isIntersecting) draw(s); else release(s);
          });
        }, { root: box, rootMargin: '100% 0px' });
        slots.forEach(function (s, i) { s.el.__i = i; io.observe(s.el); });

        // ── Pinch to zoom ──
        var dist = function (t) {
          var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
          return Math.sqrt(dx * dx + dy * dy);
        };
        var pinch = null;
        box.addEventListener('touchstart', function (e) {
          if (e.touches.length === 2) {
            var r = box.getBoundingClientRect();
            var fx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
            var fy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
            pinch = { d0: dist(e.touches), s: 1, fx: fx, fy: fy,
                      cx: box.scrollLeft + fx, cy: box.scrollTop + fy };
            inner.style.transformOrigin = pinch.cx + 'px ' + pinch.cy + 'px';
          }
        }, { passive: true });
        box.addEventListener('touchmove', function (e) {
          if (pinch && e.touches.length === 2) {
            e.preventDefault();
            var s = dist(e.touches) / pinch.d0;
            s = Math.max(1 / zoom, Math.min(4 / zoom, s));
            pinch.s = s;
            inner.style.transform = 'scale(' + s + ')';
          }
        }, { passive: false });
        var endPinch = function () {
          if (!pinch) return;
          var p = pinch; pinch = null;
          inner.style.transform = '';
          var nz = Math.max(1, Math.min(4, zoom * p.s));
          var ratio = nz / zoom;
          if (Math.abs(ratio - 1) < 0.02) return;
          zoom = nz;
          slots.forEach(release);
          layout();
          box.scrollLeft = p.cx * ratio - p.fx;
          box.scrollTop = p.cy * ratio - p.fy;
          slots.forEach(function (s) { io.unobserve(s.el); io.observe(s.el); });
        };
        box.addEventListener('touchend', function (e) { if (e.touches.length < 2) endPinch(); });
        box.addEventListener('touchcancel', endPinch);
      } catch (e) {
        say('Could not load this PDF: ' + (e && e.message ? e.message : e));
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
