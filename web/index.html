<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CS Simplified — AI-powered study platform for Computer Science students.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CS Simplified</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #1A1A2E;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Loading screen shown while Flutter initialises */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #1A1A2E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .logo-wrap {
      width: 72px;
      height: 72px;
      background: #6C63FF;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(108, 99, 255, 0.4);
    }

    .logo-text {
      color: white;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .app-name {
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .app-tagline {
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      margin-bottom: 40px;
    }

    /* Animated spinner */
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(108, 99, 255, 0.2);
      border-top-color: #6C63FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Branded loading screen — hidden once Flutter renders -->
  <div id="loading-screen">
    <div class="logo-wrap">
      <span class="logo-text">CS</span>
    </div>
    <div class="app-name">CS Simplified</div>
    <div class="app-tagline">AI-Powered Study Platform</div>
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('fade-out');
        setTimeout(function () {
          loadingScreen.style.display = 'none';
        }, 450);
      }
    });
  </script>

  <!-- pdf.js: draws the PDF pages inside the page (used by the web PDF viewer) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  </script>

  <script>
    // Draws the PDF at [url] inside [box] (used by lib/screens/pdf/pdf_web_panels.dart).
    // Pages are drawn at high density so small text stays sharp, but only the pages
    // near the screen are kept drawn, so long PDFs do not run the phone out of memory.
    window.csRenderPdf = async function (box, url) {
      var say = function (t) { box.textContent = t; };
      try {
        say('Loading PDF\u2026');
        await new Promise(function (r) { setTimeout(r, 60); });
        if (typeof pdfjsLib === 'undefined') throw new Error('pdf.js did not load');
        var resp = await fetch(url);
        if (!resp.ok) throw new Error('download failed (HTTP ' + resp.status + ')');
        var data = await resp.arrayBuffer();
        var pdf = await pdfjsLib.getDocument({ data: data }).promise;
        box.textContent = '';

        var dpr = window.devicePixelRatio || 1;
        var density = Math.min(Math.max(dpr, 2) * 1.5, 4);
        var avail = Math.max(box.clientWidth || window.innerWidth, 200);

        var slots = [];
        for (var n = 1; n <= pdf.numPages; n++) {
          var page = await pdf.getPage(n);
          var base = page.getViewport({ scale: 1 });
          var cssScale = avail / base.width;
          var slot = document.createElement('div');
          slot.style.width = Math.floor(base.width * cssScale) + 'px';
          slot.style.height = Math.floor(base.height * cssScale) + 'px';
          slot.style.margin = '0 auto 14px';
          slot.style.background = '#ffffff';
          box.appendChild(slot);
          slots.push({ el: slot, page: page, cssScale: cssScale, canvas: null, task: null });
        }

        var draw = async function (s) {
          if (s.canvas || s.task) return;
          var vp = s.page.getViewport({ scale: s.cssScale * density });
          var c = document.createElement('canvas');
          c.width = Math.floor(vp.width);
          c.height = Math.floor(vp.height);
          c.style.width = '100%';
          c.style.height = '100%';
          c.style.display = 'block';
          s.task = s.page.render({ canvasContext: c.getContext('2d'), viewport: vp });
          try {
            await s.task.promise;
            s.el.appendChild(c);
            s.canvas = c;
          } catch (e) { /* cancelled while scrolling away */ }
          s.task = null;
        };
        var release = function (s) {
          if (s.task) { try { s.task.cancel(); } catch (e) {} }
          if (s.canvas) {
            s.el.removeChild(s.canvas);
            s.canvas.width = 0; s.canvas.height = 0;
            s.canvas = null;
          }
        };

        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            var s = slots[en.target.__i];
            if (en.isIntersecting) draw(s); else release(s);
          });
        }, { root: box, rootMargin: '100% 0px' });
        slots.forEach(function (s, i) { s.el.__i = i; io.observe(s.el); });
      } catch (e) {
        say('Could not load this PDF: ' + (e && e.message ? e.message : e));
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
